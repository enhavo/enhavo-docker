name: Build latest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build all and push"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all
        run: make build-all

      - name: Push all
        run: make push-all