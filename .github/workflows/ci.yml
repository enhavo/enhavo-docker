name: Continuous Integration

on:
    push:
      branches:
        - main

jobs:
    build:
        runs-on: ubuntu-latest
        name: "Build All"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                platforms: all

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build all
              run: make build-all
